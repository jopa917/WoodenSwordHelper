plugins {
    id 'java'
}

group = 'net.tropolia'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('tropoliaArmorJar', Jar) {
    archiveBaseName = 'TropoliaArmor'
    archiveVersion = '1.0.0'

    from(sourceSets.main.output) {
        include 'net/tropolia/woodensword/TropoliaArmor.class'
        include 'net/tropolia/woodensword/TropoliaArmor$*.class'
    }

    from('src/tropoliaArmor/resources/plugin.yml') {
        rename { 'plugin.yml' }
    }
}
