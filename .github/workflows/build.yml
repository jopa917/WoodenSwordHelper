name: Build WoodenSwordHelper

on: 
  push:
    branches: [main]
    workflow_dispatch:

permissions: 
  contents: read

  jobs:
    build:
       runs-on: ubuntu-Lattest
       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Set up Java 21
           uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
         -name: Set up Gradle
          uses: gradle/actions/setup-gradle@v4
          
         -name: Build plugin
          run: gradle build

         -name: Upload plugin JAR
          uses: action/upload-artifact@v4
          with:
            name: WoodenSwordHelper
            path: build/libs/*.jar
